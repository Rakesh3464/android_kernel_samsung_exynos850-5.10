name: Compare A21s 4.19 source with 5.10
on:
  push:
    branches: [a21s-5.10-port]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 5.10 target
        uses: actions/checkout@v4
        with:
          path: target
      - name: Checkout A21s 4.19 reference
        uses: actions/checkout@v4
        with:
          repository: mustvfa/android_kernel_samsung_exynos850
          path: reference
      - name: Create source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          for tree in reference target; do
            (cd "$tree"; make kernelversion) > "report/$tree-version.txt"
            find "$tree/arch/arm64/configs" -type f | sed "s|^$tree/||" | sort > "report/$tree-configs.txt"
            find "$tree/arch/arm64/boot/dts" -type f \( -name '*.dts' -o -name '*.dtsi' \) | sed "s|^$tree/||" | sort > "report/$tree-dts.txt"
          done
          comm -23 report/reference-configs.txt report/target-configs.txt > report/reference-only-configs.txt
          comm -23 report/reference-dts.txt report/target-dts.txt > report/reference-only-dts.txt
          grep -Ei 'a21|a217|exynos850|s5e3830|atlas' report/reference-dts.txt > report/a21s-dts-candidates.txt || true
          grep -Ei 'a21|a217|exynos850|s5e3830|atlas' report/reference-configs.txt > report/a21s-config-candidates.txt || true
          python3 - <<'PY'
          from pathlib import Path
          import re
          def config(path):
              out={}
              for line in Path(path).read_text(errors='replace').splitlines():
                  m=re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-419-to-510-compatibility-report
          path: report/
          if-no-files-found: warn
,line)
                  if m: out[m.group(1)]=m.group(2)
                  m=re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-419-to-510-compatibility-report
          path: report/
          if-no-files-found: warn
,line)
                  if m: out[m.group(1)]='n'
              return out
          a=Path('reference/arch/arm64/configs/exynos850-a21snsxx_defconfig')
          b=Path('target/arch/arm64/configs/exynos850-a12snsxx_defconfig')
          if a.exists() and b.exists():
              old,new=config(a),config(b)
              with open('report/a21s-config-differences.tsv','w') as out:
                  out.write('symbol\\ta21s_4.19\\ta12s_5.10\\n')
                  for k in sorted(old.keys()|new.keys()):
                      if old.get(k)!=new.get(k):
                          out.write(f'{k}\\t{old.get(k,"ABSENT")}\\t{new.get(k,"ABSENT")}\\n')
          else:
              Path('report/config-comparison-error.txt').write_text('Missing expected defconfig files')
          PY
          echo "Inventory only: no cross-version drivers copied, no flashable image produced."
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-419-to-510-compatibility-report
          path: report/
          if-no-files-found: warn
