name: A21s 5.10 kernel source audit and optional build
on:
  push:
    branches:
      - a21s-5.10-port
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Verified A21s-compatible defconfig target (leave blank for audit only)'
        required: false
        type: string
jobs:
  audit-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves clang lld llvm device-tree-compiler python3
      - name: Audit configs and device trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          make kernelversion | tee diagnostics/kernel-version.txt
          find arch/arm64/configs -type f | sort > diagnostics/all-arm64-configs.txt
          grep -Ei 'exynos|a21|s5e3830|a12|m12' diagnostics/all-arm64-configs.txt | tee diagnostics/candidate-configs.txt || true
          find arch/arm64/boot/dts -type f \( -name '*.dts' -o -name '*.dtsi' \) | grep -Ei 'exynos850|s5e3830|a21|a12|m12' | sort > diagnostics/candidate-device-trees.txt || true
          grep -RIl -m1 -E 'a21s|a217|A217' arch/arm64/boot/dts arch/arm64/configs 2>/dev/null | head -100 > diagnostics/a21s-references.txt || true
          cat diagnostics/candidate-configs.txt
          cat diagnostics/candidate-device-trees.txt
      - name: Compile only when verified config supplied
        if: ${{ inputs.defconfig != '' }}
        shell: bash
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          [[ "$DEFCONFIG" =~ ^[a-zA-Z0-9_.-]+$ ]] || exit 1
          make O=out ARCH=arm64 LLVM=1 "$DEFCONFIG"
          make -j2 O=out ARCH=arm64 LLVM=1 Image dtbs
      - name: Upload audit and non-flashable build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-kernel-audit
          path: |
            diagnostics/
            out/.config
            out/arch/arm64/boot/Image
          if-no-files-found: ignore
